server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 256;

    # Cache estático con fingerprinting (Vite genera hashes en los nombres)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso al backend
    location /api/ {
        proxy_pass http://alloy-backend:3066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE necesita buffering desactivado
        proxy_buffering off;
        proxy_cache off;

        # Timeouts largos para SSE y batch operations
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    # SPA fallback: todo lo que no sea /api/ va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
