name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --manifest-path backend/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Node version consistency
        run: |
          PKG_MAJOR=$(grep -oE '"node"[[:space:]]*:[[:space:]]*"\^?[0-9]+' frontend/package.json | grep -oE '[0-9]+$')
          DOCKER_MAJOR=$(grep -oE '^FROM .*node:[0-9]+' Dockerfile | grep -oE '[0-9]+$')
          echo "package.json engines.node major: $PKG_MAJOR"
          echo "Dockerfile node major: $DOCKER_MAJOR"
          if [ -z "$PKG_MAJOR" ] || [ -z "$DOCKER_MAJOR" ]; then
            echo "::error::No se pudo determinar el major de Node en package.json o Dockerfile"
            exit 1
          fi
          if [ "$PKG_MAJOR" != "$DOCKER_MAJOR" ]; then
            echo "::error::Node desalineado: package.json=$PKG_MAJOR Dockerfile=$DOCKER_MAJOR"
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          # Sin `version`: la toma de `packageManager` en frontend/package.json
          package_json_file: frontend/package.json
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Fuente única de verdad: engines.node de frontend/package.json
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc -b
      - name: Run tests
        working-directory: frontend
        run: pnpm run test
      - name: Build
        working-directory: frontend
        run: pnpm run build
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
